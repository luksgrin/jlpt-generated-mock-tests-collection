    "資料をコピーする",
]
answer = 3
script = """
F: 会社で女の人と男の人が話しています。男の人はこのあと、まず何をしますか。
F: 山田さん、明日の会議の準備、お願いできますか。
M: はい。資料のコピーですね。
F: ええ。でも、その前に、会議室がまだ予約されていないかもしれないので、確認してもらえますか。人数が増えたので、大きい部屋にしたいんです。
M: わかりました。お客さんへの連絡はどうしますか。
F: それは私が午後にします。あ、部長へのメールは、資料ができてからでいいですよ。
M: はい。じゃあ、すぐ確認します。
F: 男の人はこのあと、まず何をしますか。"""

