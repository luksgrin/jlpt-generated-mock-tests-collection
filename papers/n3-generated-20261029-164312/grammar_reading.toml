[[problems]]
title = "もんだい5　内容理解（中文）"
instruction = "もんだい5　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。"
passage = """
私は大学に入ってから、一人で暮らし始めた。それまでは料理をしたことがほとんどなく、毎日母が作ってくれたご飯を食べていた。一人暮らしを始めたばかりのころは、コンビニの弁当や外食ばかりだった。しかし、一か月ほどたつと、お金が足りなくなってしまった。それに、体の調子もあまりよくなかった。
そこで、自分で料理をすることにした。最初は簡単なものさえうまく作れなかった。卵焼きを作ろうとしても、いつも焦がしてしまった。母に電話をして作り方を聞くと、母は「火が強すぎるのよ」と笑いながら教えてくれた。
それから少しずつ料理ができるようになった。今では友だちを家に呼んで、料理を作ってあげることもある。料理を始めて気づいたのは、毎日ご飯を作ることは決して簡単ではないということだ。母は仕事をしながら、毎日家族のために料理を作ってくれていた。今度家に帰ったら、母に料理を作ってあげたいと思っている。"""
domain = "reading"

