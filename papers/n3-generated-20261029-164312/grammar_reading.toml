[[problems]]
title = "もんだい3　文章の文法"
instruction = "もんだい3　つぎの文章を読んで、（28）から（31）の中に入る最もよいものを、1・2・3・4から一つえらびなさい。"
passage = """
私は去年の春に日本へ来ました。日本に来て一番驚いたのは、コンビニの便利さです。コンビニでは、食べ物や飲み物（28）、電気代の支払いや荷物の受け取りもできます。私の国にもコンビニはありますが、こんなにいろいろなサービスがある（29）。
最初のころは、日本語が上手ではなかったので、店員さんに話しかけるのが怖かったです。でも、店員さんはいつもゆっくり話して（30）。そのおかげで、少しずつ日本語で話せるようになりました。
今では、コンビニは私（31）なくてはならない場所です。"""
domain = "grammar"

