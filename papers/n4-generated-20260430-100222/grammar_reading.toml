[[problems.questions]]
id = 23
sentence = """
市民プール利用案内

開館時間:
平日：午前10時～午後8時
土日祝：午前9時～午後7時

休館日:
毎週火曜日、年末年始（12月29日～1月3日）

利用料金:
大人：500円／1回
子ども（小学生以下）：200円／1回

注意事項:
・水着と水泳帽を必ず着用してください。
・小学3年生以下の子どもは、保護者の同伴が必要です。
・プールサイドでの飲食はご遠慮ください。

質問:
田中さんは小学2年生の子どもと日曜日にプールに行きたいです。何時までプールを利用できますか。"""
options = [
    "午後5時",
    "午後6時",
    "午後7時",
    "午後8時",
]
answer = 3

