instruction = "次の（１）から（３）の文章を読んで、質問に答えなさい。答えは、１・２・３・４から最もよいものを一つ選びなさい。"
domain = "reading"

[[problems.questions]]
id = 17
sentence = """
山田さんは今日、会社を休みました。熱が３８度あり、頭も痛いそうです。医者に行って薬をもらい、家でゆっくり休むことにしました。明日は元気になって会社に行きたいと言っています。

質問:
山田さんはどうして会社を休みましたか。"""
options = [
    "頭が痛いからです。",
    "熱があるからです。",
    "医者に行くからです。",
    "熱があって頭も痛いからです。",
]
answer = 4

[[problems.questions]]
id = 18
sentence = """
お知らせ:
来週の土曜日、町内会で公園の掃除をします。午前９時から１１時までです。軍手やゴミ袋は町内会で用意します。動きやすい服装で来てください。ご協力をお願いします。

質問:
このお知らせで一番伝えたいことは何ですか。"""
options = [
    "公園の掃除の時間です。",
    "軍手やゴミ袋を用意することです。",
    "公園の掃除に参加してほしいことです。",
    "動きやすい服装で来ることです。",
]
answer = 3

[[problems.questions]]
id = 19
sentence = """
手紙:
ケンさんへ
元気ですか。私は先週、富士山に登りました。初めての登山で少し疲れましたが、頂上から見た景色は本当にきれいでした。今度はケンさんも一緒に行きませんか。来年また計画しましょう。

質問:
手紙を書いた人は、何が一番印象に残りましたか。"""
options = [
    "初めての登山だったこと。",
    "少し疲れたこと。",
    "頂上から見た景色がきれいだったこと。",
    "ケンさんと一緒に行きたいこと。",
]
answer = 3

