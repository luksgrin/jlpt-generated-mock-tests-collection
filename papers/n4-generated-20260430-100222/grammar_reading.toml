[[problems.questions]]
id = 20
sentence = """
私は小さい頃から絵を描くのが好きでした。小学校の時、絵のコンクールで賞をもらったことがあり、その時から将来は画家になりたいと思うようになりました。しかし、高校生になって、絵を描くことよりも、写真を撮ることに興味を持つようになりました。特に、自然の風景を写真に撮るのが好きです。大学では写真について勉強して、将来は世界中の美しい景色を写真に撮って、みんなに見せたいと思っています。画家になる夢は変わりましたが、美しいものを表現したいという気持ちは今も同じです。

質問:
この人は、小さい頃は何になりたかったですか。"""
options = [
    "写真家",
    "画家",
    "先生",
    "医者",
]
answer = 2

