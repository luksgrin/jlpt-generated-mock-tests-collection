[[problems]]
title = "もんだい6"
instruction = "右のページは、市民センターの料理教室の案内である。これを読んで、下の質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。"
example = ""
passage = """
案内:
さくら市民センター　4月の料理教室
① 和食コース　毎週火曜日 10:00〜12:00　料金 4,000円（全4回）　定員15名
② パン作りコース　毎週土曜日 14:00〜16:00　料金 6,000円（全4回）　定員10名
③ 親子おかしコース　4月20日（日）10:00〜12:00　料金 1人1,000円　定員10組（小学生とその保護者）
④ 夜の中華コース　毎週木曜日 19:00〜21:00　料金 5,000円（全4回）　定員12名
・申し込み：4月1日から、電話またはセンター受付で受け付けます。定員になりしだい締め切ります。
・材料費は料金に含まれています。
・エプロンとタオルは各自お持ちください。"""
domain = "reading"

