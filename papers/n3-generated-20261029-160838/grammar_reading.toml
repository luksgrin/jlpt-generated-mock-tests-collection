[[problems]]
title = "もんだい5"
instruction = "つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。"
example = ""
passage = """
私は以前、朝起きるのがとても苦手だった。毎朝ぎりぎりまで寝ていて、朝ごはんも食べずに家を出ていた。会社に着いても頭がぼんやりして、午前中はなかなか仕事が進まなかった。
ある日、同じ課の先輩が「朝の一時間は、夜の二時間と同じくらい価値があるよ」と教えてくれた。先輩は毎朝五時に起きて、ジョギングをしたり本を読んだりしているそうだ。私は半分信じられなかったが、試しに一か月だけ早く起きてみることにした。
最初の一週間は本当につらかった。夜、早く寝ようとしても眠れず、朝も目覚まし時計を何度も止めてしまった。しかし、二週間ほどたつと体が慣れてきて、自然に六時ごろ目が覚めるようになった。朝ごはんをゆっくり食べ、新聞を読んでから出かけると、気持ちに余裕ができた。仕事も午前中に集中してできるようになった。
早起きをしたからといって、すべてがうまくいくわけではない。それでも、一日の始まりを大切にすることで、生活が少しずつ変わるということを知った。"""
domain = "reading"

