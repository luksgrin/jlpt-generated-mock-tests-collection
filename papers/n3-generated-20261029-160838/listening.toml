[[problems.questions]]
id = 1
audio_track = "04"
prompt_text = "会社で"
options = [
    "会議室を予約する",
    "資料をコピーする",
    "部長にメールを送る",
    "お客さんに電話する",
]
answer = 4
script = """
F: 会社で女の人と男の人が話しています。男の人はこのあと、まず何をしますか。
F: 田中さん、明日の会議の準備、お願いできますか。
M: はい。資料のコピーと会議室の予約ですね。
F: 会議室はもう私が予約しておきました。それから、資料なんですが、部長がまだ少し直したいところがあるそうなんです。
M: じゃあ、コピーは部長の確認が終わってからですね。
F: ええ。その前に、お客様に明日の時間を確認する電話をしてもらえますか。部長へのメールはそのあとでいいので。
M: わかりました。すぐかけます。
F: 男の人はこのあと、まず何をしますか。"""

