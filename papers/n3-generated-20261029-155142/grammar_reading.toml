[[problems]]
title = "もんだい5 内容理解（中文）"
instruction = "つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。"
passage = """
私の祖母は八十歳だが、毎朝一時間ぐらい散歩をしている。雨の日でも、かさをさして出かける。以前、私が「雨の日くらい休んだら？」と言うと、祖母は笑って「歩かないと、体だけでなく気持ちまで弱くなってしまうのよ」と答えた。
祖母が散歩を始めたのは、十年前に祖父が亡くなってからだそうだ。そのころの祖母は元気がなく、家から出ない日が続いていた。心配した近所の人が、散歩に誘ってくれたのがきっかけだったという。
初めは近所を少し歩くだけだったが、だんだん遠くまで歩けるようになった。散歩の途中で知り合いが増え、今では毎朝会う友達もいる。季節の花を見つけたり、友達と話したりするのが楽しみだと言う。
祖母を見ていると、年を取っても、何か続けられることがあるのは大切なことだと思う。私も祖母のように、自分の楽しみを見つけたい。"""
domain = "reading"

