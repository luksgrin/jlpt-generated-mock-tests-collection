[[problems]]
title = "もんだい4 内容理解（短文）"
instruction = "つぎの(1)から(3)の文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。"
passage = """
(1)
メール:
山田さん
明日の会議ですが、いつもの会議室が使えなくなったため、3階の小会議室で行うことになりました。時間は午後2時からで、変わりません。資料は各自で印刷して持ってきてください。
田中

(2)
最近、スマートフォンで本を読む人が増えている。便利だが、私は紙の本のほうが好きだ。ページをめくる音や紙のにおいを感じながら読むと、内容がよく頭に入る気がするからだ。スマートフォンを使うことが悪いというわけではないが、紙の本の良さも忘れたくない。

(3)
お知らせ:
図書館を利用する皆様へ
3月10日から3月20日まで、本の整理のため休館します。この間、本の返却は入口の横にある返却ポストをご利用ください。ただし、CDやDVDはポストに入れず、3月21日以降にカウンターへお返しください。"""
domain = "reading"

