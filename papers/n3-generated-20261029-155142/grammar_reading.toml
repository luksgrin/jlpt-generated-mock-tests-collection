[[problems]]
title = "もんだい3 文章の文法"
instruction = "つぎの文章を読んで、文章全体の内容を考えて、（28）から（31）の中に入る最もよいものを、1・2・3・4から一つえらびなさい。"
passage = """
私は去年の春から日本に住んでいます。日本に来る前は、日本語がほとんど話せませんでした。駅で切符を買うこと（28）できなかったのです。
そこで、毎日近所の日本語教室に通うことにしました。先生はとても親切で、わからないことがあると、何度でも説明して（29）。
半年ぐらいたつと、少しずつ話せるようになりました。（30）、敬語はまだ難しいです。
日本語が上手になった（31）、今では日本の生活がとても楽しくなりました。"""
domain = "grammar"

