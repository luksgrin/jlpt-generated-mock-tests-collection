[[problems]]
title = "もんだい6 情報検索"
instruction = "右のページは、市民センターの料理教室の案内である。これを読んで、下の質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。"
passage = """
案内:
さくら市民センター　春の料理教室

① 和食コース　毎週土曜日 10:00～12:00　参加費 3,000円（4回分）
② パンづくりコース　毎週日曜日 13:00～15:00　参加費 4,000円（4回分）
③ 子ども料理コース（小学生のみ）　毎週土曜日 14:00～15:30　参加費 2,000円（4回分）
④ 夜のかんたん料理コース　毎週水曜日 19:00～21:00　参加費 3,500円（4回分）

・申し込みは3月20日までに、市民センターの受付か電話でお願いします。
・市内に住んでいる人は、参加費が500円安くなります。
・材料費は参加費に含まれています。"""
domain = "reading"

