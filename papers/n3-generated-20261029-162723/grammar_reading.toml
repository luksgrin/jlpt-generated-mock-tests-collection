[[problems]]
title = "もんだい5 内容理解（中文）"
instruction = "つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。"
passage = """
最近、手紙を書く人が少なくなった。メールやSNSを使えば、すぐに相手に気持ちを伝えることができるからだ。私も、友達との連絡はほとんどスマートフォンでしている。
ところが、去年の誕生日に、遠くに住んでいる祖母から手紙が届いた。字は少し震えていたが、一字一字ていねいに書かれていた。祖母は目が悪くなってきているので、この手紙を書くのにきっと長い時間がかかったはずだ。それを思うと、胸が熱くなった。
メールは便利だが、手紙には書いた人の時間と気持ちが残っている。同じ「おめでとう」という言葉でも、手で書かれた文字から伝わるものは、画面の文字とは違うと感じた。
もちろん、すべての連絡を手紙にするべきだと言っているわけではない。急ぎの用事にはメールのほうがいい。しかし、大切な人に特別な気持ちを伝えたいときには、手紙を書いてみてはどうだろうか。私は今年、祖母の誕生日に、初めて自分から手紙を送るつもりだ。"""
domain = "reading"

