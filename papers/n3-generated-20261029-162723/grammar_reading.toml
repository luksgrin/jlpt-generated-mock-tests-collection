[[problems]]
title = "もんだい4 内容理解（短文）"
instruction = "つぎの（1）から（3）の文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。"
passage = """
（1）
メモ:
山田さん
明日の会議は、十時から十一時に変わりました。資料は二十部コピーしておいてください。私は午前中、外に出ていますので、会議には少し遅れて参加します。部長には私から話しておきます。
田中

（2）
お知らせ:
市立図書館は、四月一日から開館時間が変わります。平日は午前九時から午後八時まで、土曜日と日曜日は午前九時から午後五時までです。月曜日は休館日ですが、月曜日が祝日の場合は開館し、次の日に休みます。

（3）
私は毎朝、駅まで歩いています。以前はバスを使っていましたが、運動不足を感じて、歩くことにしました。最初は二十分歩くだけで疲れましたが、今では体の調子もよく、朝の空気を楽しめるようになりました。雨の日だけはバスに乗りますが、それ以外の日は歩き続けたいと思っています。"""
domain = "reading"

