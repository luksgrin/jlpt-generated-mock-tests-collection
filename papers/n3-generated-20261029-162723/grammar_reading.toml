[[problems]]
title = "もんだい3 文章の文法"
instruction = "つぎの文章を読んで、（28）から（31）の中に入る最もよいものを、1・2・3・4から一つえらびなさい。"
passage = """
私が日本に来て驚いたことの一つは、電車が時間どおりに来る（28）。私の国では、電車が三十分遅れることも珍しくありません。（29）、日本では一分遅れただけでも、駅でおわびの放送が流れます。
また、電車の中はとても静かです。電話で話している人はほとんどいません。私も最初は友達と大きな声で話していましたが、周りの人に見られて、恥ずかしくなりました。それから、電車の中では静かにする（30）。
日本の電車は便利ですが、朝はとても混んでいます。先週、私は満員電車で三十分も（31）、とても疲れました。"""
domain = "grammar"

