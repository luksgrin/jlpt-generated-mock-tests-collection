[[problems]]
title = "もんだい3 文章の文法"
instruction = "つぎの文章を読んで、（28）から（31）の中に入る最もよいものを、1・2・3・4から一つえらびなさい。"
passage = """
文章:
私は去年、日本に来ました。日本に来て驚いたことは、電車がとても正確だということです。私の国では、電車が30分遅れることも珍しくありません。（28）、日本の電車は1分遅れただけでも、駅員が「申し訳ございません」と謝ります。
また、電車の中はとても静かです。電話で話している人はほとんどいません。最初は、なぜみんな話さないのか不思議でした。（29）、日本人の友だちに聞いてみると、周りの人に迷惑をかけないようにしているのだと教えてくれました。
私（30）、これはとても新しい経験でした。国では、電車の中で友だちと大きな声で話すのが普通だったからです。
今では私も、電車の中では静かにする（31）。日本の生活に少しずつ慣れてきたと思います。"""
domain = "grammar"

