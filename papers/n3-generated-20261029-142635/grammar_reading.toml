[[problems]]
title = "もんだい4 内容理解（短文）"
instruction = "つぎの（1）から（3）の文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。"
passage = """
メモ:
（1）山田さんへ
今日の午後、ABC会社の木村さんから電話がありました。明日の会議の時間を10時から2時に変更したいそうです。木村さんは今日は5時まで会社にいるので、それまでに電話がほしいとのことです。会議の資料は、会議のときに木村さんが持ってくるそうです。
田中

お知らせ:
（2）市立図書館は、3月1日から3月10日まで、工事のため休館します。この間、本の返却は入口の横にある返却ポストをご利用ください。ただし、CDやDVDは壊れるおそれがあるので、ポストには入れないでください。3月11日以降に、カウンターへお返しください。

文章:
（3）最近、スマートフォンで何でも調べられるようになった。分からない言葉があれば、すぐに意味が分かる。便利だが、調べたことをすぐに忘れてしまうことも多い。辞書を引いて自分で探した言葉は、なかなか忘れないものだ。便利だからといって、いつも速い方法がいいというわけではないと思う。"""
domain = "reading"

