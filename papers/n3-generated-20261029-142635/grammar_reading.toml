[[problems]]
title = "もんだい5 内容理解（中文）"
instruction = "つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。"
passage = """
私の祖母は八十歳になるが、今でも毎日自分で料理を作っている。子どものころ、私は祖母の家に行くのが楽しみだった。祖母の作る煮物がとてもおいしかったからだ。
去年の夏、私は祖母に煮物の作り方を教えてもらうことにした。祖母はレシピを書いたノートを持っていないので、作るところを見ながら覚えるしかなかった。祖母は「しょうゆを少し」「砂糖はこのくらい」と言うだけで、何グラム入れるのかは教えてくれなかった。私が「正確な量を教えて」と頼むと、祖母は笑って「味を見ながら決めればいいのよ」と言った。
家に帰って一人で作ってみたが、祖母の味にはならなかった。何度作ってもうまくいかなかった。そこで、祖母が言ったように、何度も味を見ながら作ってみた。すると、少しずつ祖母の味に近づいてきた。
料理は、決められた量を守ることも大切だが、自分の舌で確かめることがもっと大切なのだと分かった。今度祖母に会うときには、私が作った煮物を食べてもらいたいと思っている。"""
domain = "reading"

