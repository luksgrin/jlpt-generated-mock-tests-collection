[[problems]]
title = "もんだい5"
instruction = "つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。"
passage = """
私は大学に入ってから一人暮らしを始めた。最初のころは料理が全然できなかったので、毎日コンビニのお弁当ばかり食べていた。ある日、久しぶりに実家に帰ると、母に「顔色が悪いね」と言われた。そのとき、自分の食生活が問題なのではないかと気がついた。
それから、簡単な料理から作ってみることにした。はじめは野菜を切るのにも時間がかかり、味もあまりよくなかった。何度も失敗したが、インターネットで作り方を調べたり、母に電話で聞いたりしながら、少しずつ上手になった。
料理をするようになって、よかったことがいくつかある。まず、体の調子がよくなった。次に、お金も前ほど使わなくなった。そして、一番うれしかったのは、友だちを家に呼んで、自分が作った料理を食べてもらえるようになったことだ。「おいしい」と言ってもらえると、とてもうれしい。
料理は面倒だと思う人も多いだろう。しかし、私にとって料理は、生活を楽しくしてくれる大切なものになった。"""
domain = "reading"

