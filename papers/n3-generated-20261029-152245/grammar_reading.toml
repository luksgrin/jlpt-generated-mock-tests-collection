[[problems]]
title = "もんだい4"
instruction = "つぎの（1）から（3）の文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。"
passage = """
メモ:
山田さんへ
部長から電話がありました。明日の会議は10時から午後2時に変わったそうです。会議の前に資料を20部コピーしておいてほしいとのことです。部長は今日はもう会社に戻らないので、質問があったら、メールで連絡してください。田中

お知らせ:
来月から、図書館の開館時間が変わります。平日は午前9時から午後8時まで、土曜日と日曜日は午前10時から午後5時までです。また、毎週月曜日は休館日になります。本を返すときは、休館日でも入口の返却ポストを使うことができます。

文章:
最近、スマートフォンで本を読む人が増えている。便利だが、私は紙の本が好きだ。紙の本はページをめくりながら、どこまで読んだかを手で感じることができるからだ。もちろん、スマートフォンが悪いというわけではない。旅行のときなど、たくさんの本を持ち歩けるのはいいことだと思う。"""
domain = "reading"

