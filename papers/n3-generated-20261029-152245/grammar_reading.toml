[[problems]]
title = "もんだい6"
instruction = "右のページは、市民センターの教室の案内です。これを読んで、下の質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。"
passage = """
案内:
さくら市民センター　夏の教室
① 料理教室：毎週土曜日 10:00～12:00　料金 1回800円（材料費をふくむ）　定員15名
② 英会話教室：毎週火曜日・木曜日 19:00～20:30　料金 1か月4,000円　定員10名
③ 書道教室：毎週日曜日 14:00～16:00　料金 1回500円　定員12名（筆などは貸し出しあり）
④ ヨガ教室：毎週水曜日 10:00～11:00　料金 1回600円　定員20名

申し込み:
7月10日までに、センターの受付か電話で申し込んでください。
※市外に住んでいる方は、料金が1回200円高くなります（英会話教室は1か月500円高くなります）。"""
domain = "reading"

