[[problems.questions]]
id = 1
audio_track = "04"
prompt_text = "男の人はこのあと、何をしますか。"
options = [
    "新しい店を探す。",
    "料理の本を買う。",
    "料理教室を予約する。",
    "ケーキを作る。",
]
answer = 3
script = """
M: ねえ、来週の土曜日、何か予定ある？
F: ううん、特にないけど。
M: 友達が教えてくれたんだけど、新しい料理教室ができたらしいんだ。一緒に行かない？
F: へえ、面白そう！どんな料理が作れるの？
M: イタリア料理だって。ケーキも作れるみたいだよ。
F: いいね！行きたい！
M: じゃあ、僕が予約しておくよ。来週の土曜日、午後2時からだって。
F: ありがとう！楽しみだね！
M: 男の人はこのあと、何をしますか。"""

