[[problems]]
title = "もんだい3 文章の文法"
instruction = "つぎの文章を読んで、（28）から（31）の中に入る最もよいものを、1・2・3・4から一つえらびなさい。"
passage = """
私が日本に来て、もう一年になります。来たばかりのころは、日本語がほとんど話せなかったので、買い物（28）大変でした。しかし、近所の人たちがとても親切にしてくれました。特に、隣に住んでいる山田さんは、いつも私に話しかけてくれました。山田さんは、私（29）日本のお母さんのような人です。
最近、私は山田さんに料理を教えてもらっています。日本の料理は難しいと思っていましたが、実際に作ってみると、（30）。今では、簡単なものなら一人で作れるようになりました。
来年、国へ帰る予定です。日本にいる（31）、もっといろいろな料理を習いたいと思っています。"""
domain = "grammar"

