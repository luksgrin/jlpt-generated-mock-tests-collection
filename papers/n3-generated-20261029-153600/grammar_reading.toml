[[problems]]
title = "もんだい6 情報検索"
instruction = "右のページは、市民センターの教室の案内である。これを読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。"
passage = """
案内:
みどり市民センター　秋の教室のご案内
①料理教室　毎週土曜日　10:00～12:00　材料費1,000円（1回）　定員15名
②英会話教室　毎週水曜日　19:00～20:30　受講料 月3,000円　定員10名
③書道教室　毎週日曜日　14:00～16:00　受講料 月2,000円（道具は貸し出します）　定員12名
④ヨガ教室　毎週火曜日・木曜日　10:00～11:00　受講料 月4,000円　定員20名

申し込み方法:
9月20日までに、センターの受付で申し込んでください。電話での申し込みはできません。定員を超えた場合は、抽選になります。"""
domain = "reading"

