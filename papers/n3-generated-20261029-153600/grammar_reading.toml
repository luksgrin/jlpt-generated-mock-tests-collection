[[problems]]
title = "もんだい4 内容理解（短文）"
instruction = "つぎの文章1から文章3を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。"
passage = """
文章1:
さくらマンションにお住まいの皆様へ。来週の月曜日から金曜日まで、エレベーターの工事を行います。工事の間、エレベーターは使えません。重い荷物がある方は、工事が始まる前の日曜日までに運んでおいてください。ご迷惑をおかけしますが、よろしくお願いします。さくらマンション管理室

文章2:
最近、本を読む人が少なくなったと言われている。しかし、私はそうは思わない。電車の中でスマートフォンを見ている人の中にも、小説やニュースの記事を読んでいる人は多い。紙の本を読む人が減っただけで、読むこと自体が嫌いになったわけではないのだ。

文章3:
林さん、明日の会議の資料ですが、まだ完成していません。すみませんが、私のかわりに、午前中に会議室の準備をしておいてもらえませんか。資料は午後一時までに、私がコピーして持っていきます。木村"""
domain = "reading"

