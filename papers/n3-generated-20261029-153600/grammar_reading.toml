[[problems]]
title = "もんだい5 内容理解（中文）"
instruction = "つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。"
passage = """
私は以前、朝起きるのがとても苦手だった。毎朝、母に何度も起こされて、朝ご飯も食べないで家を出ていた。会社に入ってからも同じで、いつも遅刻しそうになって駅まで走っていた。
ある日、会社の先輩が「朝早く起きると、一日が長く感じられて得をするよ」と言った。先輩は毎朝五時に起きて、散歩をしたり、本を読んだりしているそうだ。私は、そんなに早く起きるのは無理だと思ったが、試しに三十分だけ早く起きてみることにした。
初めの一週間は、とてもつらかった。昼になると眠くなって、仕事に集中できない日もあった。しかし、夜早く寝るようにしたら、だんだん体が慣れてきた。今では、朝ご飯をゆっくり食べてから、余裕を持って家を出られるようになった。
早起きをして一番よかったことは、気持ちに余裕ができたことだ。急がなくてもいいので、朝から怒ったりいらいらしたりすることがなくなった。先輩の言ったことは本当だったと思う。"""
domain = "reading"

